[package]
name = "leoview"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6"
dunce = "1"
eframe = "0.37"
image = "0.25"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[build-dependencies]
winresource = "0.1"

# Decode images fast even in debug builds
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
strip = "debuginfo"
